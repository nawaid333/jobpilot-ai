name: JobPilot Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobpilot_ci
  NEXT_PUBLIC_APP_URL: https://localhost:3000
  OPENAI_API_KEY: ci-placeholder-openai-key
  GMAIL_TOKEN_ENCRYPTION_KEY: ci-placeholder-gmail-encryption-key

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobpilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d jobpilot_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        id: setup-node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Node and npm
        run: |
          node --version
          npm --version
          node -e 'const major=Number(process.versions.node.split(".")[0]); if (major < 22) { console.error(`Node 22+ is required; found ${process.version}`); process.exit(1) }'

      - name: Report Node setup fallback
        if: steps.setup-node.outcome == 'failure'
        run: echo "setup-node could not provision Node 22; continuing only because the runner already provides a compatible Node runtime."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Verify database migration state
        run: npx prisma migrate status

      - name: Lint
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: API contract tests
        run: npm run test:contracts

      - name: Application state tests
        run: npm run test:application-state

      - name: Tailoring validation tests
        run: node --test tests/tailor-validation.test.js

      - name: Production build
        run: npm run build

      - name: Start production server
        run: npm start > /tmp/jobpilot-next.log 2>&1 &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Production server did not become ready"
              cat /tmp/jobpilot-next.log
              exit 1
            fi
            sleep 2
          done

      - name: Strict production health gate
        run: node scripts/ci-health-check.mjs

      - name: Critical route smoke test
        run: timeout --signal=TERM --kill-after=10s 90s npm run smoke

      - name: API authentication smoke test
        run: timeout --signal=TERM --kill-after=10s 90s npm run smoke:api

      - name: Full MVP smoke validation
        run: timeout --signal=TERM --kill-after=10s 120s npm run smoke:mvp

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jobpilot-next-server-log
          path: /tmp/jobpilot-next.log
