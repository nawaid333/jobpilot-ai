name: JobPilot QA

on:
  push:
    branches: ["qa/security-e2e"]
  pull_request:

# CI only needs to read repository contents; keep the token least-privileged.
permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: npm audit --audit-level=high --omit=dev
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Security smoke tests
        run: npm run test:security
      - name: Application status regression
        run: npm run test:application-status
