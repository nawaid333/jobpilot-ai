name: JobPilot Production Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed JobPilot URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment URL
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
        run: |
          node -e 'const u=new URL(process.env.SMOKE_BASE_URL); if(u.protocol!=="https:") throw new Error("Production URL must use HTTPS")'

      - name: Run production API smoke test
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
        run: npm run smoke:production
